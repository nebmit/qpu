name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Run type checking
      run: npm run check

    - name: Run linter
      run: npm run lint

    - name: Run unit tests
      run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.version.outputs.version }}
      registry: ${{ env.REGISTRY }}
      image-name: ${{ env.IMAGE_NAME }}
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

    - name: Log in to Container Registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Extract deployment tag
      id: version
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        # Extract the SHA-based tag for deployment
        DEPLOYMENT_TAG=$(echo "$TAGS" | grep -E "main-[a-f0-9]{7}$" | head -1)
        if [ -z "$DEPLOYMENT_TAG" ]; then
          # Fallback: extract just the tag part after the last :
          DEPLOYMENT_TAG=$(echo "$TAGS" | head -1 | sed 's/.*://')
        fi
        if [ -z "$DEPLOYMENT_TAG" ]; then
          echo "::error::Could not determine deployment tag from metadata output"
          exit 1
        fi
        echo "version=$DEPLOYMENT_TAG" >> $GITHUB_OUTPUT
        echo "Deployment tag: $DEPLOYMENT_TAG"
        echo "All generated tags: $TAGS"

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
      with:
        context: .
        platforms: linux/arm64
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  dispatch-deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Debug deployment info
        run: |
          echo "Image digest: ${{ needs.build-and-push.outputs.image-digest }}"
          echo "Image tag: ${{ needs.build-and-push.outputs.image-tag }}"
          echo "Full image: ${{ needs.build-and-push.outputs.registry }}/${{ needs.build-and-push.outputs.image-name }}:${{ needs.build-and-push.outputs.image-tag }}"
          echo "Image by digest: ${{ needs.build-and-push.outputs.registry }}/${{ needs.build-and-push.outputs.image-name }}@${{ needs.build-and-push.outputs.image-digest }}"
      
      - name: Notify infra repo
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          repository: nebmit/infra
          event-type: app-deploy
          client-payload: '{"app":"qpu","digest":"${{ needs.build-and-push.outputs.image-digest }}"}'
          token: ${{ secrets.INFRA_DISPATCH_PAT }}
